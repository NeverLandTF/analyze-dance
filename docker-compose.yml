version: '3.8'

services:
  # MySQL 数据库服务
  db:
    image: mysql:8.0
    container_name: dance_ai_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dance_analysis}
      MYSQL_USER: ${MYSQL_USER:-dance_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dance_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dance_ai_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 Flask 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dance_ai_backend
    restart: always
    environment:
      FLASK_APP: app.py
      FLASK_ENV: production
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      FLASK_HOST: ${FLASK_HOST:-0.0.0.0}
      FLASK_PORT: ${FLASK_PORT:-5000}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-dance_user}:${MYSQL_PASSWORD:-dance_password}@db:3306/${MYSQL_DATABASE:-dance_analysis}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-dance_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dance_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dance_analysis}
      # 文件上传配置
      UPLOAD_FOLDER: /app/uploads
      VIDEO_SUBFOLDER: ${VIDEO_SUBFOLDER:-videos}
      ALLOWED_EXTENSIONS: ${ALLOWED_EXTENSIONS:-mp4,avi,mov,mkv,webm}
      ALLOWED_IMAGE_EXTENSIONS: ${ALLOWED_IMAGE_EXTENSIONS:-jpg,jpeg,png,gif,bmp,webp}
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-524288000}
      MAX_AVATAR_SIZE: ${MAX_AVATAR_SIZE:-5242880}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dance_ai_network
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads

  # 前端 Vue 服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dance_ai_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dance_ai_network

networks:
  dance_ai_network:
    driver: bridge

volumes:
  mysql_data:
  backend_uploads:
