<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#863bff"/>
      <stop offset="100%" stop-color="#47bfff"/>
    </linearGradient>
    <linearGradient id="danceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ede6ff"/>
    </linearGradient>
  </defs>
  
  <!-- 圆形背景 -->
  <circle cx="16" cy="16" r="15" fill="url(#bgGrad)"/>
  
  <!-- 舞蹈人物剪影 (简化的舞者形象) -->
  <g fill="url(#danceGrad)">
    <!-- 头部 -->
    <circle cx="16" cy="8" r="2.5"/>
    <!-- 身体 -->
    <path d="M16 11 L16 18" stroke="url(#danceGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- 左臂向上 -->
    <path d="M16 12 L12 8" stroke="url(#danceGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 右臂向上 -->
    <path d="M16 12 L20 8" stroke="url(#danceGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 左腿 -->
    <path d="M16 18 L13 24" stroke="url(#danceGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 右腿 -->
    <path d="M16 18 L19 23" stroke="url(#danceGrad)" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  
  <!-- AI 分析点 (装饰性圆点) -->
  <circle cx="12" cy="10" r="1" fill="#47bfff" opacity="0.8"/>
  <circle cx="20" cy="10" r="1" fill="#47bfff" opacity="0.8"/>
  <circle cx="16" cy="15" r="1" fill="#47bfff" opacity="0.8"/>
</svg>